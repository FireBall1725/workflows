name: Changelog
description: >
  Renders release notes with git-cliff from the shared cliff.toml. Text comes
  from PR titles where a PR exists and from the commit subject where it doesn't,
  so it works for repos that merge PRs and repos that ship straight from main.

inputs:
  tag:
    description: >
      The tag being cut, e.g. v26.8.1. Empty for nightly, which is untagged.

      Notes are always generated with --unreleased, because this runs BEFORE
      the tag is created: nothing should be published if the changelog fails.
      --latest would resolve to the PREVIOUS release and silently emit notes
      for changes that already shipped, which is what v26.8.0-rc.2 got on
      2026-08-07 before this was fixed.
    required: false
    default: ""
  config:
    description: Path to cliff.toml in the calling repo.
    required: false
    default: cliff.toml

outputs:
  content:
    description: Rendered markdown, header stripped.
    value: ${{ steps.render.outputs.content }}

runs:
  using: composite
  steps:
    - name: Install git-cliff
      shell: bash
      run: |
        set -euo pipefail
        VERSION=2.13.1
        curl -sSL "https://github.com/orhun/git-cliff/releases/download/v${VERSION}/git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C /tmp
        echo "/tmp/git-cliff-${VERSION}" >> "$GITHUB_PATH"

    - name: Render
      id: render
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        CONFIG: ${{ inputs.config }}
        # git-cliff resolves each commit to its PR through the API. Without a
        # token it silently falls back to commit subjects, which is a quiet
        # downgrade rather than a failure.
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        if [ ! -f "$CONFIG" ]; then
          echo "::error::$CONFIG not found. Run workflows/scripts/scaffold.sh in this repo."
          exit 1
        fi

        ARGS=(--config "$CONFIG" --strip header --unreleased)
        # owner/repo comes from the workflow rather than the config file, which
        # is what lets one cliff.toml be byte-identical in every repo.
        ARGS+=(--github-repo "$GITHUB_REPOSITORY")
        # Naming the tag that does not exist yet makes git-cliff treat the
        # unreleased commits as that release.
        [ -n "$TAG" ] && ARGS+=(--tag "$TAG")

        CONTENT=$(git-cliff "${ARGS[@]}")

        if [ -z "$(echo "$CONTENT" | tr -d '[:space:]')" ]; then
          CONTENT="No changes recorded."
        fi

        {
          echo "content<<CLIFF_EOF"
          echo "$CONTENT"
          echo "CLIFF_EOF"
        } >> "$GITHUB_OUTPUT"

        echo "$CONTENT"
